<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supernatural: The Hunt</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Pour le style V1) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'special-elite': ['"Special Elite"', 'cursive'],
            },
            colors: {
              'grim-black': '#0a0a0a',
              'parchment': '#dccfbf',
              'parchment-dark': '#b0a394',
              'blood-red': '#8a0b0b',
              'iron-gray': '#2e2e2e',
            }
          }
        }
      }
    </script>

    <!-- Lucide Icons (Pour les icônes V1) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Nos fichiers locaux -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="bg-grim-black text-parchment font-special-elite min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-12 gap-6 main-container">
        
        <!-- HEADER -->
        <div class="lg:col-span-12 text-center mb-4 border-b-2 border-stone-800 pb-4">
            <h1 class="text-4xl md:text-6xl text-parchment tracking-[0.2em] font-bold drop-shadow-lg text-shadow-red">
                SUPERNATURAL
            </h1>
            <p class="text-stone-500 mt-2 tracking-widest text-sm uppercase">The Hunter's Journal • Case File #34-B</p>
        </div>

        <!-- LEFT COLUMN: STATUS & INVENTORY -->
        <aside class="lg:col-span-4 space-y-6">
            <!-- Health Panel -->
            <div class="bg-stone-950 border-4 border-double border-stone-800 p-4 shadow-xl">
                <h2 class="text-parchment-dark border-b border-stone-800 pb-2 mb-4 text-lg uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="user" class="w-5 h-5"></i> État des Chasseurs
                </h2>
                <div class="space-y-4">
                    <!-- Dean -->
                    <div class="hunter-card">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold tracking-widest">DEAN</span>
                            <span id="dean-hp-text" class="text-parchment-dark">100%</span>
                        </div>
                        <div class="w-full h-4 bg-stone-900 border border-stone-600 relative">
                            <div id="dean-hp-bar" class="h-full bg-red-900 transition-all duration-500" style="width: 100%"></div>
                        </div>
                    </div>
                    <!-- Sam -->
                    <div class="hunter-card">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold tracking-widest">SAM</span>
                            <span id="sam-hp-text" class="text-parchment-dark">100%</span>
                        </div>
                        <div class="w-full h-4 bg-stone-900 border border-stone-600 relative">
                            <div id="sam-hp-bar" class="h-full bg-red-900 transition-all duration-500" style="width: 100%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Inventory Panel -->
            <div class="bg-stone-950 border-4 border-double border-stone-800 p-4 shadow-xl min-h-[200px]">
                <h2 class="text-parchment-dark border-b border-stone-800 pb-2 mb-4 text-lg uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="backpack" class="w-5 h-5"></i> Inventaire
                </h2>
                <div id="inventory-list" class="flex flex-col gap-2">
                    <!-- Items JS injected here -->
                </div>
            </div>
        </aside>

        <!-- RIGHT COLUMN: NARRATIVE -->
        <main class="lg:col-span-8 flex flex-col gap-6">
            <!-- Story Box -->
            <div class="flex-grow bg-[#1a1a1a] border-2 border-stone-600 p-1 shadow-[0_0_15px_rgba(0,0,0,0.7)] relative">
                <div class="border border-stone-700 h-full p-6 md:p-8 relative bg-dark-pattern">
                    <!-- Decorative Corners -->
                    <div class="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-stone-500"></div>
                    <div class="absolute top-2 right-2 w-4 h-4 border-t-2 border-r-2 border-stone-500"></div>
                    <div class="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-stone-500"></div>
                    <div class="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-stone-500"></div>

                    <!-- Title -->
                    <div class="flex items-center gap-3 mb-6">
                        <i data-lucide="book-open" class="text-stone-500"></i>
                        <h2 id="scene-title" class="text-2xl text-parchment font-bold border-b border-stone-800 w-full pb-2">
                            Chargement...
                        </h2>
                    </div>

                    <!-- Text -->
                    <div class="text-lg leading-relaxed text-gray-300 min-h-[150px]">
                        <span id="scene-text"></span><span id="cursor" class="animate-pulse font-bold text-blood-red">|</span>
                    </div>
                </div>
            </div>

            <!-- Choices Area -->
            <div id="choices-area" class="grid grid-cols-1 gap-3 opacity-0 transition-opacity duration-700">
                <!-- Buttons JS injected here -->
            </div>
        </main>
    </div>

</body>
</html>
